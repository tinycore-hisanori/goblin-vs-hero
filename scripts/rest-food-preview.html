<!doctype html><html lang="ja"><meta charset="utf-8"><title>休息・食事の実機UI検証</title>
<style>body{background:#24343b;color:#eee;font:14px system-ui;margin:12px}button{padding:10px;margin:4px}iframe{display:block;width:390px;height:580px;border:0;margin:10px auto}#status{text-align:center}</style>
<button id="table">食卓へ（HP1）</button><button id="bed">寝床の手前へ（HP1）</button><button id="damage">被弾</button><button id="hero">勇者がパイを食べる</button><button id="desktop">PC表示</button><button id="portrait">スマホ縦</button><button id="landscape">スマホ横</button><button id="evolution">進化可能に</button><p id="status">接続中</p><iframe id="phone" title="ゴブリン操作画面"></iframe>
<script type="module">
import * as THREE from 'three';
import {LocalSession} from '../src/local-session.js';
import {world,beds,foodTables,regenerateDungeon} from '../src/dungeon.js';
regenerateDungeon(()=>.8);
const actors=[],table=foodTables[2],start={x:table.x,z:table.z-1.35};
const spawn=()=>{const g={id:'preview-goblin',root:{position:new THREE.Vector3(start.x,0,start.z),rotation:{y:Math.PI},visible:true},model:{position:{y:0},rotation:{z:0}},spawn:start,hp:1,route:[],repath:0,cooldown:0};actors.push(g);return g;};
const session=new LocalSession({ready:()=>true,ended:()=>false,started:()=>true,preparing:()=>false,goblins:()=>actors,hero:()=>world(19,14),spawn,appearance:()=>{},tag:()=>{},motion:()=>{},damageHero:()=>{},impact:()=>{},roomReady:room=>{document.querySelector('iframe').src=`/goblin.html?room=${room}&partyGuest=1`;}});session.active=true;
function place(p){for(const g of actors){g.root.position.set(p.x,0,p.z);g.hp=1;g.bedRest=null;g.viewer.command={type:'idle'};g.route=[];}session.food.reset();session.snapshot();}
document.querySelector('#table').onclick=()=>place(start);
document.querySelector('#bed').onclick=()=>place({x:beds[2].x,z:beds[2].z-2});
document.querySelector('#damage').onclick=()=>{for(const g of actors)g.hp=Math.max(.5,g.hp-1);};
document.querySelector('#hero').onclick=()=>{session.food.eat(start,100,150,'hero',`${table.id}:pie`);session.snapshot();};
function viewport(w,h){const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';}document.querySelector('#desktop').onclick=()=>viewport(1100,580);document.querySelector('#portrait').onclick=()=>viewport(390,580);document.querySelector('#landscape').onclick=()=>viewport(740,360);document.querySelector('#evolution').onclick=()=>{for(const g of actors)g.viewer.round.xp=40;session.snapshot();};
setInterval(()=>{session.update(.05);for(const g of actors)session.updateGoblin(g,.05);document.querySelector('#status').textContent=actors.map(g=>`HP ${g.hp.toFixed(2)} · ${g.bedRest?.healing?'回復中':'待機'} · 残り食料 ${9-session.food.taken.size} · 攻撃 ${g.attackSeq||0} · 位置 ${g.root.position.x.toFixed(1)}, ${g.root.position.z.toFixed(1)}`).join(' / ');},50);
</script></html>
