<!doctype html><html lang="en"><meta charset="utf-8"><title>Lever verification</title><style>body{margin:0;background:#15252b;color:#fff;font:16px system-ui}button{padding:12px;margin:10px}canvas{display:block}p{padding:0 16px}</style><button id="closed">Close / reset</button><button id="open">Open treasure gate</button><p id="status"></p><script type="module">
import * as THREE from 'three';import {buildNest} from '../src/nest-art.js';import {leverPosition as p} from '../src/dungeon.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#15252b');const camera=new THREE.PerspectiveCamera(45,1.5,.1,200);camera.position.set(p.x+1.4,1.5,p.z+2.5);camera.lookAt(p.x,.65,p.z);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(900,600);document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x63716b,3));
const material=color=>new THREE.MeshStandardMaterial({color});const box=(w,h,d,x,y,z,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;};const {lever}=buildNest(scene,box,material);
function draw(angle){lever.rotation.z=angle;scene.updateMatrixWorld(true);const shaft=lever.getObjectByName('lever-shaft'),knob=lever.getObjectByName('lever-knob'),tip=shaft.localToWorld(new THREE.Vector3(0,.35,0)),actual=knob.getWorldPosition(new THREE.Vector3());document.querySelector('#status').textContent=`Angle ${angle} / Knob-to-shaft-tip gap ${tip.distanceTo(actual).toFixed(6)} / Knob X ${actual.x.toFixed(3)}`;renderer.render(scene,camera);}
document.querySelector('#closed').onclick=()=>draw(-.5);document.querySelector('#open').onclick=()=>draw(.5);draw(-.5);
</script></html>
