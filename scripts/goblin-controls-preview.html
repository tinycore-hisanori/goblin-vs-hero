<!doctype html><html lang="ja"><meta charset="utf-8"><title>ゴブリン操作の検証</title>
<style>body{background:#18282b;color:white;font:13px system-ui;margin:8px}button{padding:8px;margin:3px}iframe{display:block;width:1100px;height:620px;border:0}p{margin:4px}</style>
<button id="floor">広場へ戻す</button><button id="bones">骨の手前へ</button><button id="victim">正面に仲間を置く</button><button id="mobile">スマホ表示</button><button id="desktop">PC表示</button><p id="metrics"></p><iframe id="phone" title="ゴブリン操作画面"></iframe>
<script type="module">
import "../src/i18n.js";
import * as THREE from 'three';
import {LocalSession} from '../src/local-session.js';
import {world} from '../src/dungeon.js';
const actors=[],start=world(5,21);let peak=0,attacks=0,jumps=0;
const spawn=()=>{const g={id:'test-'+actors.length,root:{position:new THREE.Vector3(start.x,0,start.z),rotation:{y:Math.PI},visible:true},model:{position:{y:0},rotation:{z:0}},spawn:start,hp:6,route:[],repath:0,cooldown:0};actors.push(g);return g;};
const session=new LocalSession({ready:()=>true,ended:()=>false,started:()=>true,preparing:()=>false,goblins:()=>actors,hero:()=>({x:100,y:0,z:100}),spawn,appearance(){},tag(){},motion(){},impact(){},damageHero(){},roomReady:room=>document.querySelector('iframe').src=`/goblin.html?room=${room}&partyGuest=1`});session.active=true;
const receive=session.receive.bind(session);session.receive=message=>{if(message.command?.type==='jump')jumps++;receive(message);};
function place(p){const g=actors.find(g=>g.viewer);if(!g)return;g.root.position.set(p.x,0,p.z);g.jump=null;g.hp=6;g.viewer.command={type:'idle'};peak=0;session.snapshot();}
document.querySelector('#floor').onclick=()=>place(start);
document.querySelector('#bones').onclick=()=>{const p=world(12,11);place({x:p.x,z:p.z+1.4});};
document.querySelector('#victim').onclick=()=>{const g=actors.find(g=>g.viewer);if(!g)return;const v=actors.find(g=>!g.viewer)||spawn();v.hp=6;v.root.visible=true;v.root.position.copy(g.root.position).add(new THREE.Vector3(Math.sin(g.root.rotation.y)*.9,0,Math.cos(g.root.rotation.y)*.9));session.snapshot();};
document.querySelector('#mobile').onclick=()=>{document.querySelector('iframe').style.width='390px';};document.querySelector('#desktop').onclick=()=>{document.querySelector('iframe').style.width='1100px';};
setInterval(()=>{session.update(.02);for(const g of actors)if(g.viewer)session.updateGoblin(g,.02);const g=actors.find(g=>g.viewer);if(g){peak=Math.max(peak,g.root.position.y);document.querySelector('#metrics').textContent=`座標 ${g.root.position.x.toFixed(2)},${g.root.position.y.toFixed(2)},${g.root.position.z.toFixed(2)} / 最高 ${peak.toFixed(2)} / ジャンプ ${jumps} / 攻撃 ${g.attackSeq||0} / 同族 ${g.viewer.friendlyFire?'ON':'OFF'} / 仲間HP ${actors.find(g=>!g.viewer)?.hp??'—'}`;}},20);
</script></html>
