<!doctype html><html lang="ja"><meta charset="utf-8"><title>ゴブリンの巣・開発用俯瞰図</title><style>body{margin:0;background:#101719;color:#efdab0;font:14px system-ui}h1{position:fixed;top:12px;left:28px;font-size:23px;letter-spacing:3px}p{position:fixed;bottom:12px;left:28px;color:#c0c9b8}canvas{display:block}</style><h1>GOBLIN NEST — 部屋と生活空間</h1><p>開発用俯瞰図：ゲーム内マップは探索済みの場所だけ表示します。</p><script type="module">
import * as THREE from 'three';import {tiles,SIZE,CELL,world,rooms,gatePosition,treasurePosition} from './src/dungeon.js';import {buildNest} from './src/nest-art.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101719');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);camera.position.set(31,63,44);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe2e4d0,0x383e35,3));const sun=new THREE.DirectionalLight(0xffd19b,2);sun.position.set(10,30,15);scene.add(sun);const material=color=>new THREE.MeshStandardMaterial({color,roughness:.9});
function box(w,h,d,x,y,z,mat,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m;}
const stone=material('#434c43');for(let z=0;z<SIZE;z++)for(let x=0;x<SIZE;x++){const p=world(x,z);if(tiles[z][x]!=='#')box(CELL,.15,CELL,p.x,-.1,p.z,stone);else if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dz])=>tiles[z+dz]?.[x+dx]&&tiles[z+dz][x+dx]!=='#'))box(CELL,.8,CELL,p.x,.4,p.z,stone);}
buildNest(scene,box,material);box(2,1,.2,gatePosition.x,.5,gatePosition.z,material('#9c7043'));box(.8,.5,.6,treasurePosition.x,.25,treasurePosition.z,material('#e0b54f'));renderer.render(scene,camera);
</script></html>
