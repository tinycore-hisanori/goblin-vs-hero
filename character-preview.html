<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゴブリン・ロード / アニメーション確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#141b18;color:#e6d8b1;font:14px system-ui}canvas{display:block}header{position:fixed;top:24px;left:28px;pointer-events:none}h1{font:25px Georgia,serif;letter-spacing:3px;margin:0 0 9px}header p{font-size:12px;color:#a8b6a4}nav{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:10px;background:#111a15e8;border:1px solid #9d8b4f55}button{white-space:nowrap;background:#243328;color:#e8d7a1;border:1px solid #9d8b4f55;padding:11px 19px;cursor:pointer}select{background:#243328;color:#e8d7a1;border:1px solid #9d8b4f55;padding:8px}nav{max-width:95vw;flex-wrap:wrap;justify-content:center}button.active{background:#d0b16d;color:#1b271c}#status{position:fixed;right:25px;top:25px;font-size:12px;color:#a8b6a4}
</style><header><h1 id="character-name">GOBLIN LORD</h1><p id="character-description">暗黒騎士 / ドラッグで回転・ホイールで拡大</p></header><div id="status">モデル読み込み中…</div><nav><select id="character"><option value="cyclops">サイクロプス</option><option value="ai">AIゴブリン</option><option value="viewer">視聴者ゴブリン</option><option value="child">子ゴブリン</option><option value="lord">ゴブリン・ロード</option><option value="hob">ホブゴブリン</option><option value="king">ゴブリン・キング</option></select><button data-clip="sit">座る</button><button data-clip="stand" hidden>立つ（逆再生）</button><button data-clip="Walking">歩く</button><button data-clip="Running">走る</button><button data-clip="Shared_Punch">パンチ（共通）</button><button data-clip="Simple_Kick" id="kick">キック</button><button id="pause">一時停止</button></nav><script type="module">
import {t,onLanguageChange} from "/src/i18n.js";
import {loadPunch,retargetPunch} from './src/goblin-attack.js';import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#141b18');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,100);camera.position.set(3,2.2,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2;controls.update();scene.add(new THREE.HemisphereLight(0xe4eddb,0x45533d,2));const key=new THREE.DirectionalLight(0xffd7aa,3);key.position.set(3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0x9bbfce,2);rim.position.set(-3,3,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.4,.12,64),new THREE.MeshStandardMaterial({color:'#354038',roughness:.9}));floor.position.y=-.06;scene.add(floor);let mixer,current,paused=false;const clock=new THREE.Clock();
const definitions={cyclops:{title:'CYCLOPS',url:'/models/cyclops.glb',height:2.8,sourceHeight:2,sit:null},ai:{title:'AI GOBLIN',url:'/models/ai-goblin.glb',height:1.2,sourceHeight:1.8,sit:null},viewer:{title:'VIEWER GOBLIN',url:'/models/viewer-goblin.glb',height:1.2,sourceHeight:1.8,sit:null},child:{title:'CHILD GOBLIN',url:'/models/child-goblin.glb',height:1,sourceHeight:1.98,sit:null,transition:false},king:{title:'GOBLIN KING',url:'/models/goblin-king.glb',height:1.95,sourceHeight:1.8,sit:null,transition:false},lord:{title:'GOBLIN LORD',url:'/models/goblin-lord.glb',height:2.3,sourceHeight:1.72,sit:'Sit_Cross_Legged_on_Floor',transition:false},hob:{title:'HOB GOBLIN',url:'/models/hob-goblin.glb',height:1.6,sourceHeight:1.77,sit:'_01a18163_5d08_70bf_80af_d69753befe75',transition:true}};
let model,actions,definition,loadVersion=0;
function play(name){if(!actions)return;if((name==='sit'||name==='stand')&&!definition.sit)return;const seated=name==='sit',reverse=name==='stand',clip=seated||reverse?definition.sit:name;if(current)current.stop();current=actions[clip];if(!current)return;current.reset();if(definition.transition&&(seated||reverse)){current.setLoop(THREE.LoopOnce,1);current.clampWhenFinished=true;current.setEffectiveTimeScale(reverse?-1:1);current.time=reverse?current.getClip().duration:0;}else{current.clampWhenFinished=false;current.setLoop(THREE.LoopRepeat,Infinity).setEffectiveTimeScale(1);}current.play();paused=false;document.querySelector('#pause').textContent='一時停止';for(const b of document.querySelectorAll('[data-clip]'))b.classList.toggle('active',b.dataset.clip===name);camera.position.set(2.7,1.8,4.2);controls.target.set(0,seated?.65:1,0);controls.update();document.querySelector('#status').textContent=`28ボーン / ${seated?'座る':reverse?'立つ（座る動作の逆再生）':name}`;}
async function loadCharacter(id){const version=++loadVersion;actions=null;current=null;mixer?.stopAllAction();if(model){scene.remove(model);model.traverse(n=>{n.geometry?.dispose();for(const m of (Array.isArray(n.material)?n.material:n.material?[n.material]:[])){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose();}});model=null;}definition=definitions[id];document.querySelector('#kick').hidden=id!=='cyclops';document.querySelector('#character-name').textContent=definition.title;document.querySelector('#character-description').textContent=(id==='cyclops'?'サイクロプス':id==='ai'?'AIゴブリン':id==='viewer'?'視聴者ゴブリン':id==='child'?'子ゴブリン（確認用拡大表示）':id==='hob'?'ホブゴブリン':id==='king'?'ゴブリン・キング':'暗黒騎士')+' / ドラッグで回転・ホイールで拡大';document.querySelector('#status').textContent='モデル読み込み中…';document.querySelector('[data-clip="stand"]').hidden=!definition.transition;document.querySelector('[data-clip="sit"]').hidden=!definition.sit;document.querySelector('[data-clip="sit"]').textContent=definition.transition?'立ち姿から座る':'座る';document.title=definition.title+' / アニメーション確認';try{const asset=await new GLTFLoader().loadAsync(definition.url);if(version!==loadVersion)return;model=asset.scene;model.scale.setScalar(definition.height/definition.sourceHeight);scene.add(model);mixer=new THREE.AnimationMixer(model);const punch=retargetPunch(model,await loadPunch());if(version!==loadVersion)return;actions=Object.fromEntries([...asset.animations,punch].map(c=>[c.name,mixer.clipAction(c)]));for(const b of document.querySelectorAll('[data-clip]')){const key=b.dataset.clip;if(!['sit','stand'].includes(key))b.disabled=!actions[key];}play(definition.sit?'sit':actions.Walking?'Walking':asset.animations[0].name);}catch(e){console.error(e);document.querySelector('#status').textContent='モデル読み込み失敗';}}
for(const b of document.querySelectorAll('[data-clip]'))b.onclick=()=>play(b.dataset.clip);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止';};const select=document.querySelector('#character');const requested=new URLSearchParams(location.search).get('model');select.value=definitions[requested]?requested:'lord';select.onchange=()=>loadCharacter(select.value);loadCharacter(select.value);

function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer&&!paused)mixer.update(dt);controls.update();renderer.render(scene,camera);}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
